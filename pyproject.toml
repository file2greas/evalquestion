[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "file2greas-evalquestion"
version = "0.1.0"
description = "按能力维度从场景清单生成题目，标出覆盖与重复"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "file2greas" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://file2greas.github.io"
Repository = "https://github.com/file2greas/evalquestion"
Issues = "https://github.com/file2greas/evalquestion/issues"

[project.scripts]
evalquestion = "evalquestion:main"

[tool.setuptools]
py-modules = ["evalquestion"]
